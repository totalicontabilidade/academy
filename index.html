<!DOCTYPE html>

<!-- ============================================================
     POLÍTICA DE SEGURANÇA DE CONTEÚDO

     Voltou a ser "só a própria origem" para script em 23/09/2026,
     quando o App Check saiu: era o reCAPTCHA que obrigava a abrir
     o `script-src` para dois domínios do Google. Agora nenhum
     script de terceiro roda nesta página.

     O que continua vindo de fora, e por quê:
       i.ytimg.com        a miniatura de cada aula, de graça
       youtube-nocookie   o player, no modo que não deixa cookie
       firebasestorage    a capa, o áudio e o PDF que a equipe sobe
     ============================================================ -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self';
  style-src 'self' 'unsafe-inline';
  img-src 'self' data: blob: https://i.ytimg.com https://firebasestorage.googleapis.com https://totali-academy.firebasestorage.app;
  media-src 'self' blob: https://firebasestorage.googleapis.com https://totali-academy.firebasestorage.app;
  frame-src https://www.youtube-nocookie.com https://www.youtube.com;
  font-src 'self';
  connect-src 'self'
    https://firestore.googleapis.com
    https://identitytoolkit.googleapis.com
    https://securetoken.googleapis.com
    https://firebasestorage.googleapis.com
    https://totali-academy.firebasestorage.app;
  object-src 'none';
  base-uri 'self';
  form-action 'none';
  frame-ancestors 'self';
">
<meta name="referrer" content="strict-origin-when-cross-origin">

<title>Academy · Totali</title>
<meta name="description" content="A Academy da Totali Soluções Contábeis: trilhas curtas em vídeo sobre notas fiscais, impostos, folha de pagamento e a rotina da sua empresa.">
